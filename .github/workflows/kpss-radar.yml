
name: KPSS Radar Günlük Kontrol

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gunluk-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kütüphaneleri kur
        run: pip install -r backend/requirements.txt

      - name: İlanları tara
        run: python backend/scanner.py
        
