
name: KPSS Radar Günlük Kontrol

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gunluk-kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: pip install -r backend/requirements.txt

      - name: İlanları tara ve raporu kaydet
        run: |
          set -o pipefail
          python backend/scanner.py | tee report.json

      - name: Raporu depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          git commit -m "Günlük KPSS Radar raporu" || echo "Yeni rapor değişikliği yok"
          git push
          
