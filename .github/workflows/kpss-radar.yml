
name: KPSS Radar Günlük Kontrol

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: İlanları tara ve raporu oluştur
        run: |
          python backend/scanner.py > report.json

      - name: Raporu GitHub deposuna kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.json
          if git diff --cached --quiet; then
            echo "Rapor değişmedi."
          else
            git commit -m "KPSS Radar raporunu güncelle"
            git push
          fi
          
